# RK3567 default learning configuration.
# The C demo accepts the same values as CLI flags.

video_device=/dev/video0
width=1280
height=720
fps=30
pixel_format=NV12
frames=60
raw_output=out/rk3567_nv12.yuv
preview_output=out/rk3567_preview.ppm

# RK3567 notes:
# - USB camera often appears as /dev/video0 and may output YUYV/MJPEG.
# - MIPI CSI camera often appears after rkcif/rkisp as another /dev/videoX.
# - Use scripts/01_rk3567_probe_media.sh to find the correct capture node.
